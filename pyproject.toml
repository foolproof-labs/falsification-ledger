[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "falsification-ledger"
version = "0.1.1"
description = "Hash-chained, append-only pre-registration ledger for research claims, with falsification contracts, adjudication, and Wilson-CI hit-rate reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.18"]
keywords = ["preregistration", "falsification", "reproducibility", "ledger", "research", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
fl = "falsification_ledger.cli:main"
falsification-ledger = "falsification_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

